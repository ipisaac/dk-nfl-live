app = "dk-nfl-live"
primary_region = "yyz"
kill_signal = "SIGTERM"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Every viewer holds one SSE connection; Fly's default hard limit is 25.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 1000
    hard_limit = 1000

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
